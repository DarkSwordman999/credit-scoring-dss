# СППР «Кредитный скоринг» во внутреннем контуре Банка (ПР 7-8, объединённая диаграмма компонентов и размещения):
#   web-frontend (nginx + React) → backend-api (FastAPI) → PostgreSQL;
#   scoring-service — отдельный сервис скоринга без состояния (А-1, И-2, Р-1);
#   scheduler — повторные запросы в БКИ, мониторинг методики, резервные копии.
# Запуск:  cp .env.example .env  (задать пароли)  &&  docker compose up -d
# Демо-данные:  docker compose exec api creditdss demo
# Несколько экземпляров сервиса скоринга:  docker compose up -d --scale scoring=3
# HTTPS (Б-1):  задать DOMAIN в .env  &&  docker compose --profile https up -d   (прокси Caddy, порты 80 и 443)
name: creditdss

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit_db"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    image: ${IMAGE_PREFIX:-creditdss}/backend:${TAG:-latest}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      CREDITDSS_DATABASE_URL: postgresql+psycopg://credit:${DB_PASSWORD}@db:5432/credit_db
      CREDITDSS_SECRET_KEY: ${SECRET_KEY:-}   # пусто — ключ создаётся в томе creditdata (/data/secret.key)
      CREDITDSS_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CREDITDSS_SCORING_URL: http://scoring:8001
      CREDITDSS_SCORING_KEY: ${SCORING_KEY:?задайте SCORING_KEY в .env}
      CREDITDSS_ABS_API_KEY: ${ABS_API_KEY:-abs-demo-key}
      CREDITDSS_LDAP_URL: ${LDAP_URL:-}
      CREDITDSS_LDAP_DOMAIN: ${LDAP_DOMAIN:-}
      CREDITDSS_SCHEDULER_ENABLED: "false"
    volumes:
      - creditdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 30

  scoring:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    image: ${IMAGE_PREFIX:-creditdss}/backend:${TAG:-latest}
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    environment:
      <<: *env
    command: ["uvicorn", "creditdss.scoring_service:app", "--host", "0.0.0.0", "--port", "8001"]

  scheduler:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    image: ${IMAGE_PREFIX:-creditdss}/backend:${TAG:-latest}
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    environment:
      <<: *env
    command: ["creditdss", "scheduler"]
    volumes:
      - creditdata:/data

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    image: ${IMAGE_PREFIX:-creditdss}/web:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-8080}:80"

  proxy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  creditdata:
  caddydata:
