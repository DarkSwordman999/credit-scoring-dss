{% extends "base.html" %}
{% block content %}
<h1>Кредитные продукты</h1>
<table>
  <tr><th>Продукт</th><th>Сумма, ₽</th><th>Срок, мес.</th><th>Ставка, %</th></tr>
  {% for p in products %}
  <tr><td>{{ p.name }}</td><td>{{ money(p.min_amount) }} – {{ money(p.max_amount) }}</td><td>{{ p.min_term }} – {{ p.max_term }}</td><td>{{ p.rate }}</td></tr>
  {% endfor %}
</table>

<h2>Добавить продукт</h2>
<form method="post" class="box">
  <label>Название <input name="name" required></label>
  <label>Сумма от, ₽ <input name="min_amount" type="number" min="1" required></label>
  <label>Сумма до, ₽ <input name="max_amount" type="number" min="1" required></label>
  <label>Срок от, мес. <input name="min_term" type="number" min="1" required></label>
  <label>Срок до, мес. <input name="max_term" type="number" min="1" required></label>
  <label>Ставка, % годовых <input name="rate" type="number" step="0.1" min="0.1" required></label>
  <button>Добавить</button>
</form>
{% endblock %}
